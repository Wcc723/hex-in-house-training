    <!--
      圓體字：Fredoka（標題拉丁字）、Nunito（內文拉丁字）、Huninn（jf 粉圓，中文）。
      Google Fonts 會依 unicode-range 切片，只下載頁面上用到的中文字。
      離線時退回系統的蘋方，版面不會跑掉，只是少了圓體的味道。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Huninn&family=Nunito:wght@400..800&display=swap"
    />
    <style>
      /*
       * 避免載入時閃深色。這三處（color-scheme、theme-color、下面這行）
       * 活在 React 樹與 Tailwind build 之外，任何 token 層級的搜尋都掃不到，
       * 改色票時最容易漏。值要跟 theme.css 的 --color-ink 一致。
       */
      html { background: #fff6e3; }
    </style>
